# Builds the mod on every push. Download the jar from the run's "Artifacts",
# or from the Releases page when a version tag (v*) is pushed.
name: build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build --stacktrace
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sky-lyrics-jar
          path: build/libs/
      - name: read mod version
        id: ver
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"
      - name: publish release
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Sky Lyrics ${{ steps.ver.outputs.version }} (Minecraft 26.2, Fabric)
          files: build/libs/*.jar
          body: |
            Shows the lyrics of the song playing in Spotify, synced, floating in the Minecraft sky.

            **Install:** put the jar below and [Fabric API](https://modrinth.com/mod/fabric-api) (26.2) into `.minecraft/mods`, launch the Fabric 26.2 profile, play something in the Spotify desktop app and look up.

            **Keys:** `K` show/hide · `[` lyrics earlier · `]` lyrics later. Settings: `.minecraft/config/skylyrics.json`.
      - name: remove temporary log branches
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for b in ci-logs ci-logs-windows; do
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/$b" 2>/dev/null && echo "deleted $b" || true
          done

  media-reader:
    runs-on: windows-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: run the media reader for a few seconds
        shell: pwsh
        run: |
          $p = Start-Process powershell.exe -PassThru -NoNewWindow `
            -ArgumentList '-NoLogo','-NoProfile','-NonInteractive','-ExecutionPolicy','Bypass','-File','src/main/resources/skylyrics/media.ps1','-Filter','spotify','-ParentPid',"$PID" `
            -RedirectStandardOutput out.txt -RedirectStandardError err.txt
          Start-Sleep -Seconds 10
          $alive = -not $p.HasExited
          if ($alive) { Stop-Process -Id $p.Id -Force }
          @("alive_after_10s=$alive", '--- stdout', (Get-Content out.txt -TotalCount 15), '--- stderr', (Get-Content err.txt)) | Set-Content media-reader.log
          Get-Content media-reader.log
      - name: validate output
        shell: pwsh
        run: |
          $lines = @(Get-Content out.txt | Where-Object { $_ -match '^\{' })
          if ($lines.Count -lt 5) { throw "media reader printed only $($lines.Count) JSON lines" }
          foreach ($l in $lines) { $o = $l | ConvertFrom-Json; if ($null -eq $o.ok) { throw "bad line: $l" } }
          "ok: $($lines.Count) valid lines"
